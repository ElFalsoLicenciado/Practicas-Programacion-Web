<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="es">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <!-- Titulo de la ventana -->
    <title>Administracion</title>
    
    <!-- Iconito bonito para el sitio web -->
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
    
    <!-- Link para enlazar el CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/form-admin.css">
    <link rel="stylesheet" href="assets/css/forms.css">
</head>

<body>
    <div id="header-base">
        <div id="header-brand">
            <div id="header-logo" onclick="document.location='index.html'">
                <img src="assets/img/bdg1.jpg" alt="Logo TECNM Morelia" id="logo-img">
                <div id="header-title">BANDA DE GUERRA TECNM</div>
            </div>
        </div>
        <div id="header-links">
            <a href="login.htm" class="header-link">Iniciar sesion</a>
            <a href="admin.htm" class="header-link">Administracion</a>
            <a href="about-us.htm" class="header-link">Acerca de nosotros</a>
        </div>
        <div class="menu-toggle" id="menuToggle">
            ☰
        </div>
    </div>
    <div id="main-content">
        <h1>Administracion.</h1>
        <div>
            <p>Un aplauso para la administracion</p>
        </div>
        <div class="admin-panel">
            <h2>Administración de Cursos</h2>
            <div class="admin-tabs">
                <button onclick="mostrarSeccion('alta')">Alta</button>
                <button onclick="mostrarSeccion('baja')">Baja</button>
                <button onclick="mostrarSeccion('actualizar')">Actualizar</button>
            </div>
            <div id="alta" class="admin-section">
                <h3>Agregar Curso</h3>
                <form action="#" method="post">
                    <div class="form-group">
                        <label>Nombre del curso</label>
                        <input type="text" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Imagen del curso (URL)</label>
                        <input type="text" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Número de clases</label>
                        <input type="text" class="form-input">
                    </div>
                    <button type="submit" class="register-btn">
                        Agregar Curso
                    </button>
                </form>
            </div>
            <div id="baja" class="admin-section" style="display:none;">
                <h3>Eliminar Curso</h3>
                <form action="#" method="post">
                    <div class="form-group">
                        <label>Seleccionar curso</label>
                        <select class="form-input">
                            <option>Caja</option>
                            <option>Corneta</option>
                            <option>Señalamientos</option>
                            <option>Marcha</option>
                        </select>
                    </div>
                    <button class="delete-btn">
                        Eliminar Curso
                    </button>
                </form>
            </div>
            <div id="actualizar" class="admin-section" style="display:none;">
                
                <h3>Actualizar Curso</h3>
                <form action="#" method="post">
                    <div class="form-group">
                        <label>Seleccionar curso</label>
                        <select class="form-input">
                            <option>Caja</option>
                            <option>Corneta</option>
                            <option>Señalamientos</option>
                            <option>Marcha</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nuevo nombre</label>
                        <input type="text" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Nueva imagen (URL)</label>
                        <input type="text" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Número de clases</label>
                        <input type="text" class="form-input">
                    </div>
                    <button class="update-btn">
                        Actualizar Curso
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div id="footer">
        <p> Validaciones </p>
        <div >
        </div>
        <div id="validations-section">
            <p>
                <a href="https://validator.w3.org/check?uri=referer">
                    <img src="https://www.w3.org/Icons/valid-html401" alt="Valid HTML 4.01 Transitional" height="31" width="88">
                </a>
            </p>
            <p>
                <a href="https://jigsaw.w3.org/css-validator/check/referer">
                    <img style="border:0;width:88px;height:31px" src="https://jigsaw.w3.org/css-validator/images/vcss-blue" alt="Valid CSS">
                </a>
            </p>
        </div>
        <div id="copyright-footer">
            <p>© 2026 Banda de Guerra TECNM. Todos los derechos reservados.</p>
        </div>
    </div>
    <script type="text/javascript">
        function mostrarSeccion(seccion){
            document.getElementById("alta").style.display="none";
            document.getElementById("baja").style.display="none";
            document.getElementById("actualizar").style.display="none";
            
            document.getElementById(seccion).style.display="block"; 
        }
    </script>
</body>



</html>
